<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <rect width="320" height="80" fill="#080910"/>
  <g transform="translate(20, 12)">
    <!-- Fish body -->
    <path d="M0 28 Q10 8 30 12 Q50 16 60 28 Q65 30 60 32 Q50 44 30 48 Q10 52 0 28Z" fill="#e4e6ef"/>
