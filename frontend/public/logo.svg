  </g>
  <text x="100" y="36" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="700" fill="#e4e6ef" letter-spacing="-0.3">FishMark</text>
  <text x="100" y="56" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#5c6078" letter-spacing="0.5">フィッシュマーク</text>
