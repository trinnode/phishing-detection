# fly.toml — MARKup phishing detection backend on Fly.io
# Replaces Railway as the backend host. Build context = repo root (matches Railway).
app = "markup-phishing-detection"
primary_region = "cdg"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PORT = "8080"
  FLASK_ENV = "production"
  MARKUP_DATA_DIR = "/app/var"
  GUNICORN_WORKERS = "1"

# ── HTTP service (gunicorn on :8080) ────────────────────────────────────────
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 50

  [[http_service.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[http_service.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[http_service.health_checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/api/health"

# ── Single always-on machine ─────────────────────────────────────────────────
# 1024 MB RAM is recommended so the auto-training (41k samples) does not OOM.
[[vm]]
  cpus = 1
  cpu_kind = "shared"
  memory = "1gb"

# ── Persistent storage (single volume: Fly Machines allow only 1 per machine) ─
# Everything under MARKUP_DATA_DIR (/app/var) survives redeploys.
[[mounts]]
  source = "markup_data"
  destination = "/app/var"