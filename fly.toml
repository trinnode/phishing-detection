# fly.toml app configuration file generated for markup-phishing-detection on 2026-08-10T13:25:19Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'markup-phishing-detection'
primary_region = 'cdg'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  FLASK_ENV = 'production'
  PORT = '8080'

[[mounts]]
  source = 'markup_models'
  destination = '/app/models'

[[mounts]]
  source = 'markup_results'
  destination = '/app/results'

[[mounts]]
  source = 'markup_uploads'
  destination = '/app/uploads'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 50

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
